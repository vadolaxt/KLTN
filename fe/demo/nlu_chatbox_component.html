<!-- CHATBOX COMPONENT START -->
<style>
  /* ─── CSS Variables (match NLU design system) ─── */
  :root {
    --cb-green-dark:   #1a4a1a;
    --cb-green-main:   #2d7a2d;
    --cb-green-light:  #4caf50;
    --cb-green-pale:   #e8f5e9;
    --cb-gold:         #c9a227;
    --cb-gold-light:   #f0c040;
    --cb-white:        #ffffff;
    --cb-gray-light:   #f5f5f5;
    --cb-gray-mid:     #e0e0e0;
    --cb-text-dark:    #1a1a1a;
    --cb-text-mid:     #444;
    --cb-text-light:   #777;
    --cb-radius:       14px;
    --cb-shadow:       0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
    --cb-shadow-btn:   0 4px 20px rgba(45,122,45,0.45);
    --cb-shadow-hover: 0 8px 32px rgba(45,122,45,0.6);
  }

  /* ─── FAB Button ─── */
  #nlu-chatbot-fab {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 9999;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cb-green-main) 0%, var(--cb-green-dark) 100%);
    border: 3px solid var(--cb-gold);
    box-shadow: var(--cb-shadow-btn);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
    outline: none;
  }
  #nlu-chatbot-fab:hover {
    transform: scale(1.12) translateY(-3px);
    box-shadow: var(--cb-shadow-hover);
  }
  #nlu-chatbot-fab:active {
    transform: scale(0.96);
  }
  #nlu-chatbot-fab svg {
    width: 28px; height: 28px;
    fill: #fff;
    transition: opacity .2s;
  }
  #nlu-chatbot-fab .fab-icon-close {
    display: none;
  }
  #nlu-chatbot-fab.open .fab-icon-chat { display: none; }
  #nlu-chatbot-fab.open .fab-icon-close { display: block; }

  /* Pulse ring */
  #nlu-chatbot-fab::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2.5px solid var(--cb-green-light);
    opacity: 0;
    animation: cb-pulse 2.4s ease-out infinite;
  }
  @keyframes cb-pulse {
    0%   { opacity: .55; transform: scale(1); }
    70%  { opacity: 0;   transform: scale(1.35); }
    100% { opacity: 0;   transform: scale(1.35); }
  }

  /* Unread badge */
  #nlu-fab-badge {
    position: absolute;
    top: -4px; right: -4px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #e53935;
    border: 2px solid #fff;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Be Vietnam Pro', sans-serif;
    animation: cb-badge-pop .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cb-badge-pop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }
  #nlu-fab-badge.hidden { display: none; }

  /* ─── Chat Window ─── */
  #nlu-chatbox {
    position: fixed;
    bottom: 108px;
    right: 32px;
    z-index: 9998;
    width: 380px;
    height: 560px;
    background: #fff;
    border-radius: var(--cb-radius);
    box-shadow: var(--cb-shadow);
    border: 1.5px solid var(--cb-gray-mid);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: bottom right;
    transform: scale(0.85) translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: transform .28s cubic-bezier(.34,1.35,.64,1), opacity .22s ease;
  }
  #nlu-chatbox.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
  }

  /* Header */
  .cb-header {
    background: linear-gradient(135deg, var(--cb-green-dark) 0%, var(--cb-green-main) 100%);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--cb-gold);
    flex-shrink: 0;
  }
  .cb-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid var(--cb-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .cb-header-info { flex: 1; }
  .cb-header-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    font-family: 'Be Vietnam Pro', sans-serif;
    line-height: 1.2;
  }
  .cb-header-status {
    font-size: 11.5px;
    color: rgba(255,255,255,0.75);
    font-family: 'Be Vietnam Pro', sans-serif;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }
  .cb-header-status::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #69f0ae;
    display: inline-block;
    box-shadow: 0 0 6px #69f0ae;
  }
  .cb-header-actions { display: flex; gap: 6px; }
  .cb-header-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
  }
  .cb-header-btn:hover { background: rgba(255,255,255,0.25); }
  .cb-header-btn svg { width: 15px; height: 15px; fill: currentColor; }

  /* Messages area */
  .cb-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fafafa;
    scroll-behavior: smooth;
  }
  .cb-messages::-webkit-scrollbar { width: 5px; }
  .cb-messages::-webkit-scrollbar-track { background: transparent; }
  .cb-messages::-webkit-scrollbar-thumb { background: var(--cb-gray-mid); border-radius: 4px; }

  /* Message bubbles */
  .cb-msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: cb-msg-in .22s ease;
  }
  @keyframes cb-msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .cb-msg.bot { align-self: flex-start; }
  .cb-msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .cb-msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--cb-green-pale);
    border: 1.5px solid var(--cb-green-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .cb-bubble {
    max-width: 240px;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--cb-text-dark);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .cb-msg.bot .cb-bubble {
    background: #fff;
    border: 1px solid var(--cb-gray-mid);
    border-bottom-left-radius: 4px;
  }
  .cb-msg.user .cb-bubble {
    background: linear-gradient(135deg, var(--cb-green-main), var(--cb-green-dark));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .cb-bubble-time {
    font-size: 10px;
    color: var(--cb-text-light);
    margin-top: 4px;
    text-align: right;
    font-family: 'Be Vietnam Pro', sans-serif;
  }
  .cb-msg.bot .cb-bubble-time { text-align: left; }

  /* Typing indicator */
  .cb-typing {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cb-typing-dots {
    background: #fff;
    border: 1px solid var(--cb-gray-mid);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 10px 16px;
    display: flex;
    gap: 4px;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .cb-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--cb-green-main);
    animation: cb-bounce .9s ease infinite;
  }
  .cb-dot:nth-child(2) { animation-delay: .15s; }
  .cb-dot:nth-child(3) { animation-delay: .30s; }
  @keyframes cb-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .6; }
    30%            { transform: translateY(-5px); opacity: 1; }
  }

  /* Quick replies */
  .cb-quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 14px 10px;
  }
  .cb-quick-btn {
    background: var(--cb-green-pale);
    border: 1.5px solid var(--cb-green-main);
    color: var(--cb-green-dark);
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    font-family: 'Be Vietnam Pro', sans-serif;
    white-space: nowrap;
  }
  .cb-quick-btn:hover {
    background: var(--cb-green-main);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(45,122,45,0.3);
  }

  /* Input area */
  .cb-input-area {
    padding: 12px 14px;
    border-top: 1.5px solid var(--cb-gray-mid);
    background: #fff;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .cb-input-wrap {
    flex: 1;
    background: var(--cb-gray-light);
    border: 1.5px solid var(--cb-gray-mid);
    border-radius: 22px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color .18s, box-shadow .18s;
  }
  .cb-input-wrap:focus-within {
    border-color: var(--cb-green-main);
    box-shadow: 0 0 0 3px rgba(45,122,45,0.1);
    background: #fff;
  }
  .cb-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 13.5px;
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--cb-text-dark);
    resize: none;
    max-height: 80px;
    line-height: 1.4;
  }
  .cb-input::placeholder { color: var(--cb-text-light); }
  .cb-send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cb-green-main), var(--cb-green-dark));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 2px 8px rgba(45,122,45,0.4);
    flex-shrink: 0;
  }
  .cb-send-btn:hover { transform: scale(1.1); box-shadow: 0 4px 14px rgba(45,122,45,0.55); }
  .cb-send-btn svg { width: 18px; height: 18px; fill: #fff; }

  /* Expand link in header */
  .cb-expand-tip {
    font-size: 10.5px;
    color: rgba(255,255,255,0.6);
    font-family: 'Be Vietnam Pro', sans-serif;
    padding: 5px 18px;
    background: rgba(0,0,0,0.15);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    flex-shrink: 0;
  }
  .cb-expand-tip a {
    color: var(--cb-gold-light);
    text-decoration: none;
    font-weight: 600;
  }
  .cb-expand-tip a:hover { text-decoration: underline; }

  /* Scrollbar styled */
  @media (max-width: 480px) {
    #nlu-chatbox { width: calc(100vw - 24px); right: 12px; bottom: 96px; }
    #nlu-chatbot-fab { right: 16px; bottom: 20px; }
  }
</style>

<!-- FAB Button -->
<button id="nlu-chatbot-fab" onclick="nluToggleChat()" title="Chatbot tư vấn tuyển sinh NLU" aria-label="Mở chatbot">
  <span id="nlu-fab-badge" class="hidden">1</span>
  <!-- Chat icon -->
  <svg class="fab-icon-chat" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
  </svg>
  <!-- Close icon -->
  <svg class="fab-icon-close" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<!-- Chat Window -->
<div id="nlu-chatbox" role="dialog" aria-label="Chatbot tư vấn tuyển sinh">

  <!-- Header -->
  <div class="cb-header">
    <div class="cb-avatar">🤖</div>
    <div class="cb-header-info">
      <div class="cb-header-name">NLU Tư Vấn Tuyển Sinh</div>
      <div class="cb-header-status">Đang hoạt động</div>
    </div>
    <div class="cb-header-actions">
      <a href="nlu_chat_page.html" class="cb-header-btn" title="Mở trang chat đầy đủ" target="_self">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </a>
      <button class="cb-header-btn" onclick="nluToggleChat()" title="Đóng">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>

  <!-- Expand tip -->
  <div class="cb-expand-tip">
    💬 Muốn chat đầy đủ hơn? <a href="nlu_chat_page.html">Mở trang chat →</a>

  <!-- Messages -->
  <div class="cb-messages" id="nlu-cb-messages">
    <!-- Bot greeting -->
    <div class="cb-msg bot">
      <div class="cb-msg-avatar">🤖</div>
      <div>
        <div class="cb-bubble">Xin chào! 👋 Mình là <strong>NLU Assistant</strong>, chatbot tư vấn tuyển sinh của Trường Đại học Nông Lâm TP.HCM. Mình có thể giúp gì cho bạn hôm nay?</div>
        <div class="cb-bubble-time">Vừa xong</div>
      </div>
    </div>
  </div>

  <!-- Quick replies -->
  <div class="cb-quick-replies" id="nlu-quick-replies">
    <button class="cb-quick-btn" onclick="nluSendQuick(this, 'Phương thức xét tuyển 2025')">📋 Phương thức xét tuyển</button>
    <button class="cb-quick-btn" onclick="nluSendQuick(this, 'Học phí các ngành')">💰 Học phí</button>
    <button class="cb-quick-btn" onclick="nluSendQuick(this, 'Điểm chuẩn năm trước')">📊 Điểm chuẩn</button>
    <button class="cb-quick-btn" onclick="nluSendQuick(this, 'Hạn nộp hồ sơ')">📅 Thời hạn nộp</button>
  </div>

  <!-- Input area -->
  <div class="cb-input-area">
    <div class="cb-input-wrap">
      <textarea class="cb-input" id="nlu-cb-input" rows="1" placeholder="Nhập câu hỏi tuyển sinh..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();nluSendMsg();}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    </div>
    <button class="cb-send-btn" onclick="nluSendMsg()" title="Gửi">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function() {
  // ── State ──
  var _isOpen = false;
  var _msgCount = 0;

  // ── Demo responses ──
  var _responses = {
    'phương thức xét tuyển 2025': 'NLU 2025 có <strong>4 phương thức</strong> xét tuyển:<br>① Điểm thi THPT Quốc gia<br>② Học bạ THPT (xét tổ hợp)<br>③ Điểm thi đánh giá năng lực<br>④ Tuyển thẳng theo quy định Bộ GD&ĐT<br><br>Bạn muốn biết chi tiết phương thức nào? 😊',
    'học phí các ngành': 'Học phí NLU 2025 dao động từ <strong>14,5 – 23 triệu đồng/năm</strong> tuỳ ngành. Các ngành Nông nghiệp công nghệ cao, Thú y, Công nghệ thực phẩm thường có mức cao hơn. Bạn muốn hỏi ngành cụ thể nào?',
    'điểm chuẩn năm trước': 'Điểm chuẩn 2024 tại NLU dao động từ <strong>16 – 24 điểm</strong> (thang 30). Ngành Thú y, Công nghệ sinh học thường cao nhất. Bạn muốn tra ngành cụ thể không?',
    'hạn nộp hồ sơ': '📅 <strong>Thời hạn nộp hồ sơ 2025</strong>:<br>• Đợt 1 (Học bạ): 15/04 – 30/05/2025<br>• Đợt 2 (THPT): Sau khi có kết quả thi<br>• Xét tuyển bổ sung (nếu có): tháng 9/2025<br><br>Bạn muốn biết thêm về quy trình nộp hồ sơ không?',
  };

  window.nluToggleChat = function() {
    _isOpen = !_isOpen;
    var box = document.getElementById('nlu-chatbox');
    var fab = document.getElementById('nlu-chatbot-fab');
    var badge = document.getElementById('nlu-fab-badge');
    if (_isOpen) {
      box.classList.add('open');
      fab.classList.add('open');
      badge.classList.add('hidden');
      setTimeout(function() {
        var msgs = document.getElementById('nlu-cb-messages');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
        var input = document.getElementById('nlu-cb-input');
        if (input) input.focus();
      }, 280);
    } else {
      box.classList.remove('open');
      fab.classList.remove('open');
    }
  };

  window.nluSendQuick = function(btn, text) {
    btn.closest('.cb-quick-replies').remove();
    _addUserMsg(text);
    _botThinkReply(text.toLowerCase());
  };

  window.nluSendMsg = function() {
    var input = document.getElementById('nlu-cb-input');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    _addUserMsg(text);
    _botThinkReply(text.toLowerCase());
  };

  function _addUserMsg(text) {
    _msgCount++;
    var msgs = document.getElementById('nlu-cb-messages');
    var now = _timeNow();
    var div = document.createElement('div');
    div.className = 'cb-msg user';
    div.innerHTML = '<div><div class="cb-bubble">' + _escHtml(text) + '</div><div class="cb-bubble-time">' + now + '</div></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function _botThinkReply(query) {
    var msgs = document.getElementById('nlu-cb-messages');
    // Show typing
    var typing = document.createElement('div');
    typing.className = 'cb-msg bot cb-typing-wrap';
    typing.innerHTML = '<div class="cb-msg-avatar">🤖</div><div class="cb-typing"><div class="cb-typing-dots"><div class="cb-dot"></div><div class="cb-dot"></div><div class="cb-dot"></div></div></div>';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
    // Reply after delay
    setTimeout(function() {
      typing.remove();
      var reply = _getReply(query);
      var now = _timeNow();
      var div = document.createElement('div');
      div.className = 'cb-msg bot';
      div.innerHTML = '<div class="cb-msg-avatar">🤖</div><div><div class="cb-bubble">' + reply + '</div><div class="cb-bubble-time">' + now + '</div></div>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }, 900 + Math.random() * 500);
  }

  function _getReply(q) {
    for (var key in _responses) {
      if (q.includes(key.split(' ')[0]) || q.includes(key.split(' ')[1] || '')) {
        return _responses[key];
      }
    }
    if (q.includes('xin chào') || q.includes('hello') || q.includes('hi')) {
      return 'Xin chào bạn! 😊 Mình sẵn sàng hỗ trợ bạn về thông tin tuyển sinh NLU. Bạn muốn hỏi về điều gì?';
    }
    if (q.includes('ngành') || q.includes('khoa')) {
      return 'NLU có <strong>50+ ngành đào tạo</strong> thuộc 15 khoa/viện. Bạn có thể tham khảo danh sách đầy đủ tại website chính thức hoặc cho mình biết lĩnh vực bạn quan tâm để tư vấn cụ thể hơn nhé!';
    }
